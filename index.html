<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Lesti Kejora - Official Support</title>
  <meta name="description" content="Layanan Eksklusif dan Pengajuan Resmi Lesti Kejora.">

  <!-- SEO -->
  <meta name="robots" content="index, follow">
  <meta name="theme-color" content="#1a0713">

  <!-- OpenGraph -->
  <meta property="og:title" content="Lesti Kejora Official">
  <meta property="og:description" content="Layanan Resmi dan Pengajuan Khusus Lesti Kejora">
  <meta property="og:image" content="https://cdn1-production-images-kly.akamaized.net/XbbToS5dARCgUJzFXib9z9kbras=/0x916:3072x2647/1280x720/filters:quality(75):strip_icc():format(webp)/kly-media-production/medias/9302171/original/004522400_1784535769-SaveClip.App_750211085_18625944712000681_2252825388956562911_n.jpg">
  <meta property="og:type" content="website">

  <!-- Google Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">

  <style>
    :root {
      --rose-100: #ffe4f0;
      --rose-200: #fbcfe8;
      --rose-400: #f472b6;
      --rose-600: #db2777;
      --plum-900: #1a0713;
      --plum-800: #2a0d20;
      --glass: rgba(255, 255, 255, 0.10);
      --glass-strong: rgba(255, 255, 255, 0.16);
      --stroke: rgba(255, 255, 255, 0.22);
      --shadow-lg: 0 24px 60px rgba(0, 0, 0, 0.45);
      --radius-lg: 26px;
      --radius-md: 16px;
    }

    * { box-sizing: border-box; }

    html { -webkit-text-size-adjust: 100%; }

    body {
      margin: 0;
      min-height: 100vh;
      min-height: 100dvh;
      padding: 32px 18px 28px;
      font-family: 'Plus Jakarta Sans', system-ui, -apple-system, 'Segoe UI', sans-serif;
      color: #fff;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 18px;
      position: relative;
      isolation: isolate;
      background-color: var(--plum-900);
      background-image:
        radial-gradient(120% 90% at 50% 0%, rgba(219, 39, 119, 0.35) 0%, rgba(26, 7, 19, 0) 60%),
        linear-gradient(rgba(20, 5, 15, 0.55), rgba(20, 5, 15, 0.78)),
        url('https://www.broadcastmagz.com/wp-content/uploads/2026/06/IMG_20260618_061924.jpg');
      background-repeat: no-repeat;
      background-position: center center;
      background-size: cover;
      background-attachment: fixed;
    }

    /* Ornamen cahaya lembut di belakang kartu */
    body::before {
      content: "";
      position: fixed;
      inset: auto 50% -30vh 50%;
      width: min(680px, 120vw);
      aspect-ratio: 1;
      transform: translateX(-50%);
      background: radial-gradient(circle, rgba(244, 114, 182, 0.28) 0%, rgba(244, 114, 182, 0) 70%);
      filter: blur(10px);
      z-index: -1;
      pointer-events: none;
    }

    .branding {
      width: 100%;
      max-width: 400px;
      text-align: center;
      padding: 26px 22px 24px;
      border-radius: var(--radius-lg);
      background: var(--glass);
      border: 1px solid var(--stroke);
      box-shadow: var(--shadow-lg);
      backdrop-filter: blur(16px) saturate(140%);
      -webkit-backdrop-filter: blur(16px) saturate(140%);
      user-select: none;
      animation: rise 0.6s ease both;
    }

    .branding .eyebrow {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      margin: 0 0 12px;
      padding: 6px 14px;
      border-radius: 999px;
      font-size: 11px;
      font-weight: 700;
      letter-spacing: 0.14em;
      text-transform: uppercase;
      color: var(--rose-100);
      background: rgba(255, 255, 255, 0.12);
      border: 1px solid rgba(255, 255, 255, 0.18);
    }

    .branding .eyebrow::before {
      content: "";
      width: 6px;
      height: 6px;
      border-radius: 50%;
      background: var(--rose-400);
      box-shadow: 0 0 0 4px rgba(244, 114, 182, 0.25);
    }

    .branding h1 {
      margin: 0;
      font-size: clamp(26px, 7vw, 34px);
      font-weight: 800;
      line-height: 1.1;
      letter-spacing: 0.06em;
      background: linear-gradient(180deg, #ffffff 0%, var(--rose-200) 100%);
      -webkit-background-clip: text;
      background-clip: text;
      color: transparent;
      text-shadow: 0 2px 18px rgba(0, 0, 0, 0.25);
    }

    .branding .tagline {
      margin: 10px 0 0;
      font-size: 13px;
      font-weight: 500;
      line-height: 1.5;
      color: rgba(255, 255, 255, 0.78);
    }

    .app-container {
      width: 100%;
      max-width: 400px;
      padding: 24px 20px 26px;
      border-radius: var(--radius-lg);
      background: linear-gradient(180deg, rgba(60, 16, 44, 0.55) 0%, rgba(30, 8, 22, 0.62) 100%);
      border: 1px solid var(--stroke);
      box-shadow: var(--shadow-lg);
      backdrop-filter: blur(18px) saturate(140%);
      -webkit-backdrop-filter: blur(18px) saturate(140%);
      animation: rise 0.6s ease 0.08s both;
    }

    .app-container h2 {
      margin: 0 0 6px;
      font-size: 16px;
      font-weight: 700;
      line-height: 1.4;
      text-align: center;
      color: #fff;
    }

    .app-container .hint {
      margin: 0 0 20px;
      font-size: 12.5px;
      line-height: 1.55;
      text-align: center;
      color: rgba(255, 255, 255, 0.66);
    }

    .whatsapp-btn {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 10px;
      width: 100%;
      padding: 17px 20px;
      border: 0;
      border-radius: var(--radius-md);
      font-family: inherit;
      font-size: 15.5px;
      font-weight: 800;
      letter-spacing: 0.01em;
      text-decoration: none;
      color: #3b0a24;
      background: linear-gradient(180deg, #ffffff 0%, #ffe4f0 100%);
      box-shadow: 0 10px 24px rgba(219, 39, 119, 0.28), inset 0 1px 0 rgba(255, 255, 255, 0.9);
      cursor: pointer;
      transition: transform 0.2s ease, box-shadow 0.2s ease, filter 0.2s ease;
      -webkit-tap-highlight-color: transparent;
    }

    .whatsapp-btn .icon {
      font-size: 18px;
      line-height: 1;
    }

    .whatsapp-btn:hover {
      transform: translateY(-2px);
      filter: brightness(1.03);
      box-shadow: 0 16px 32px rgba(219, 39, 119, 0.38), inset 0 1px 0 rgba(255, 255, 255, 0.9);
    }

    .whatsapp-btn:active {
      transform: translateY(0) scale(0.995);
      box-shadow: 0 6px 14px rgba(219, 39, 119, 0.25);
    }

    .whatsapp-btn:focus-visible {
      outline: 3px solid var(--rose-400);
      outline-offset: 3px;
    }

    .copyright {
      margin: 0;
      font-size: 11.5px;
      font-weight: 500;
      text-align: center;
      color: rgba(255, 255, 255, 0.6);
      text-shadow: 0 1px 3px rgba(0, 0, 0, 0.5);
    }

    @keyframes rise {
      from { opacity: 0; transform: translateY(14px); }
      to   { opacity: 1; transform: translateY(0); }
    }

    @media (prefers-reduced-motion: reduce) {
      * { animation: none !important; transition: none !important; }
    }

    @media (max-width: 380px) {
      body { padding: 20px 14px 22px; }
      .branding { padding: 22px 18px; }
      .app-container { padding: 20px 16px 22px; }
    }
  </style>
</head>

<body>

  <!-- Header identitas -->
  <header class="branding">
    <p class="eyebrow">Official Support</p>
    <h1>LESTI KEJORA</h1>

  </header>

  <!-- Menu layanan -->
  <main class="app-container">

    <!-- Ganti nomor 628xxxxxxxxxx dengan nomor WhatsApp tujuan Anda -->
    <a href="https://wa.me/62817377586?text=Halo%20dedek%20lesti%20,%20saya%20minta%20bantuannya." class="whatsapp-btn" target="_blank" rel="noopener noreferrer">
      <span class="icon" aria-hidden="true">💬</span> Ambil Disini
    </a>
  </main>

  <footer class="copyright">
    &copy; 2026 Lesti Kejora. All rights reserved.
  </footer>

</body>
</html>
